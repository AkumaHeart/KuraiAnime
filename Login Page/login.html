<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/login.css">
    <link rel="icon" href="img/KuraiAnime-logo1.ico" type="image/x-icon">
    <title>「KuraiAnime」暗いアニメ | Login</title>
  </head>
  <body>
    <img src="img/KuraiAnime-logo2.png" class="Logo2" alt="KuraiAnime logo 2">
    <div class="login-box">
      <img src="img/avatar.png" class="avatar" alt="Avatar Image">
      <h1>Login Here</h1>
      <form class="login-form" action="index.html" method="post">
        <label for="username">Username</label>
        <input type="text" placeholder="Enter Username">
        <label for="password">Password</label>
        <input type="password" placeholder="Enter password">
        <input type="submit" value="Log In">
        <a href="#">Lost your Password?</a>
        <br>
        <a href="#">Don't have An account?</a>
        <br>
        <br>
        <a href="https://pages.github.com/" class="active">Powered by: GitHub Pages</a>
        <br>
      </form>
    </div>
  </body>
</html>
